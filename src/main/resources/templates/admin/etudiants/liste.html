<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Étudiants</title>
</head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Étudiants</h1>
        <a th:href="@{/admin/etudiants/nouveau}" class="btn btn-primary">+ Nouvel étudiant</a>
    </div>

    <form th:action="@{/admin/etudiants}" method="get" class="row g-2 mb-3">
        <div class="col-md-5">
            <input type="text" name="q" th:value="${q}" class="form-control"
                   placeholder="Rechercher par nom, prénom, matricule ou filière...">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary">Rechercher</button>
            <a th:href="@{/admin/etudiants}" class="btn btn-outline-secondary">Réinitialiser</a>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle bg-white">
            <thead class="table-light">
            <tr>
                <th>Matricule</th>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Email</th>
                <th>Filière</th>
                <th>Niveau</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="e : ${etudiants}">
                <td th:text="${e.matricule}"></td>
                <td th:text="${e.nom}"></td>
                <td th:text="${e.prenom}"></td>
                <td th:text="${e.email}"></td>
                <td th:text="${e.filiere}"></td>
                <td th:text="${e.niveau}"></td>
                <td class="text-end">
                    <a th:href="@{/admin/etudiants/{id}/modifier(id=${e.id})}"
                       class="btn btn-sm btn-outline-primary">Modifier</a>
                    <form th:action="@{/admin/etudiants/{id}/supprimer(id=${e.id})}" method="post"
                          class="d-inline"
                          onsubmit="return confirm('Supprimer cet étudiant ?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Supprimer</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(etudiants)}">
                <td colspan="7" class="text-center text-muted py-4">Aucun étudiant trouvé.</td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
