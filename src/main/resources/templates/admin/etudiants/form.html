<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Étudiant</title>
</head>
<body>
<section>
    <h1 class="h3 mb-3" th:text="${etudiant.id == null} ? 'Nouvel étudiant' : 'Modifier l\'étudiant'"></h1>

    <form th:action="@{/admin/etudiants}" th:object="${etudiant}" method="post"
          class="card card-body">
        <input type="hidden" th:field="*{id}">

        <div class="row g-3">
            <div class="col-md-6">
                <label for="nom" class="form-label">Nom *</label>
                <input type="text" id="nom" th:field="*{nom}" class="form-control"
                       th:classappend="${#fields.hasErrors('nom')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{nom}"></div>
            </div>

            <div class="col-md-6">
                <label for="prenom" class="form-label">Prénom *</label>
                <input type="text" id="prenom" th:field="*{prenom}" class="form-control"
                       th:classappend="${#fields.hasErrors('prenom')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{prenom}"></div>
            </div>

            <div class="col-md-6">
                <label for="email" class="form-label">Email *</label>
                <input type="email" id="email" th:field="*{email}" class="form-control"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{email}"></div>
            </div>

            <div class="col-md-6">
                <label for="motDePasse" class="form-label">Mot de passe</label>
                <input type="password" id="motDePasse" th:field="*{motDePasse}" class="form-control"
                       autocomplete="new-password">
                <div class="form-text" th:if="${etudiant.id != null}">
                    Laisser vide pour conserver le mot de passe actuel.
                </div>
            </div>

            <div class="col-md-4">
                <label for="matricule" class="form-label">Matricule</label>
                <input type="text" id="matricule" th:field="*{matricule}" class="form-control">
            </div>

            <div class="col-md-4">
                <label for="filiere" class="form-label">Filière</label>
                <input type="text" id="filiere" th:field="*{filiere}" class="form-control">
            </div>

            <div class="col-md-4">
                <label for="niveau" class="form-label">Niveau</label>
                <input type="text" id="niveau" th:field="*{niveau}" class="form-control">
            </div>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <a th:href="@{/admin/etudiants}" class="btn btn-secondary">Annuler</a>
        </div>
    </form>
</section>
</body>
</html>
