<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Entreprise</title>
</head>
<body>
<section>
    <h1 class="h3 mb-3" th:text="${entreprise.id == null} ? 'Nouvelle entreprise' : 'Modifier l\'entreprise'"></h1>

    <form th:action="@{/admin/entreprises}" th:object="${entreprise}" method="post"
          class="card card-body">
        <input type="hidden" th:field="*{id}">

        <div class="row g-3">
            <div class="col-md-6">
                <label for="nom" class="form-label">Nom *</label>
                <input type="text" id="nom" th:field="*{nom}" class="form-control"
                       th:classappend="${#fields.hasErrors('nom')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{nom}"></div>
            </div>

            <div class="col-md-6">
                <label for="secteur" class="form-label">Secteur</label>
                <input type="text" id="secteur" th:field="*{secteur}" class="form-control">
            </div>

            <div class="col-md-12">
                <label for="adresse" class="form-label">Adresse</label>
                <input type="text" id="adresse" th:field="*{adresse}" class="form-control">
            </div>

            <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" th:field="*{email}" class="form-control"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{email}"></div>
            </div>

            <div class="col-md-6">
                <label for="telephone" class="form-label">Téléphone</label>
                <input type="text" id="telephone" th:field="*{telephone}" class="form-control">
            </div>

            <div class="col-md-12">
                <label for="tuteur" class="form-label">Tuteur (contact en entreprise)</label>
                <input type="text" id="tuteur" th:field="*{tuteur}" class="form-control">
            </div>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <a th:href="@{/admin/entreprises}" class="btn btn-secondary">Annuler</a>
        </div>
    </form>
</section>
</body>
</html>
