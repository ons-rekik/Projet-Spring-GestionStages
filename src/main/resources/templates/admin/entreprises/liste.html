<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Entreprises</title>
</head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Entreprises d'accueil</h1>
        <a th:href="@{/admin/entreprises/nouveau}" class="btn btn-primary">+ Nouvelle entreprise</a>
    </div>

    <form th:action="@{/admin/entreprises}" method="get" class="row g-2 mb-3">
        <div class="col-md-5">
            <input type="text" name="q" th:value="${q}" class="form-control"
                   placeholder="Rechercher par nom...">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary">Rechercher</button>
            <a th:href="@{/admin/entreprises}" class="btn btn-outline-secondary">Réinitialiser</a>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle bg-white">
            <thead class="table-light">
            <tr>
                <th>Nom</th>
                <th>Secteur</th>
                <th>Adresse</th>
                <th>Email</th>
                <th>Téléphone</th>
                <th>Tuteur</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="e : ${entreprises}">
                <td th:text="${e.nom}"></td>
                <td th:text="${e.secteur}"></td>
                <td th:text="${e.adresse}"></td>
                <td th:text="${e.email}"></td>
                <td th:text="${e.telephone}"></td>
                <td th:text="${e.tuteur}"></td>
                <td class="text-end">
                    <a th:href="@{/admin/entreprises/{id}/modifier(id=${e.id})}"
                       class="btn btn-sm btn-outline-primary">Modifier</a>
                    <form th:action="@{/admin/entreprises/{id}/supprimer(id=${e.id})}" method="post"
                          class="d-inline"
                          onsubmit="return confirm('Supprimer cette entreprise ?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Supprimer</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(entreprises)}">
                <td colspan="7" class="text-center text-muted py-4">Aucune entreprise trouvée.</td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
