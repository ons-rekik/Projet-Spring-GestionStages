<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Stages</title>
</head>
<body>
<section>
    <h1 class="h3 mb-3">Stages et statistiques</h1>

    <!-- Statistiques -->
    <div class="row g-3 mb-3">
        <div class="col-6 col-md-2">
            <div class="card text-center h-100">
                <div class="card-body py-3">
                    <div class="fs-3 fw-bold" th:text="${stats.totalStages}">0</div>
                    <div class="text-muted small">Total stages</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-2" th:each="entry : ${stagesParStatut}">
            <div class="card text-center h-100">
                <div class="card-body py-3">
                    <div class="fs-3 fw-bold" th:text="${entry.value}">0</div>
                    <div class="text-muted small" th:text="${entry.key}">STATUT</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-2">
            <div class="card text-center h-100 border-warning">
                <div class="card-body py-3">
                    <div class="fs-3 fw-bold" th:text="${stats.stagesSansEncadrant}">0</div>
                    <div class="text-muted small">Sans encadrant</div>
                </div>
            </div>
        </div>
    </div>
    <div class="text-muted small mb-4">
        <span th:text="${stats.totalEtudiants}">0</span> étudiants ·
        <span th:text="${stats.totalEnseignants}">0</span> enseignants ·
        <span th:text="${stats.totalEntreprises}">0</span> entreprises
    </div>

    <!-- Filtres -->
    <form th:action="@{/admin/stages}" method="get" class="row g-2 mb-3">
        <div class="col-md-4">
            <input type="text" name="q" th:value="${q}" class="form-control"
                   placeholder="Rechercher (sujet, étudiant, entreprise, encadrant)...">
        </div>
        <div class="col-md-3">
            <select name="statut" class="form-select">
                <option value="">Tous les statuts</option>
                <option th:each="st : ${statuts}" th:value="${st}" th:text="${st}"
                        th:selected="${statut != null and statut.name() == st.name()}"></option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary">Filtrer</button>
            <a th:href="@{/admin/stages}" class="btn btn-outline-secondary">Réinitialiser</a>
        </div>
    </form>

    <!-- Tableau -->
    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle bg-white">
            <thead class="table-light">
            <tr>
                <th>Sujet</th>
                <th>Étudiant</th>
                <th>Entreprise</th>
                <th>Encadrant</th>
                <th>Période</th>
                <th>Statut</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${stages}">
                <td th:text="${s.sujet}"></td>
                <td th:text="${s.etudiantNomComplet}"></td>
                <td th:text="${s.entrepriseNom}"></td>
                <td>
                    <span th:if="${s.encadrantId != null}" th:text="${s.encadrantNomComplet}"></span>
                    <span th:if="${s.encadrantId == null}" class="badge bg-warning text-dark">Non affecté</span>
                </td>
                <td>
                    <span th:text="${#temporals.format(s.dateDebut, 'dd/MM/yyyy')}"></span>
                    →
                    <span th:text="${#temporals.format(s.dateFin, 'dd/MM/yyyy')}"></span>
                </td>
                <td>
                    <span class="badge" th:text="${s.statut}"
                          th:classappend="${s.statut.name() == 'EN_ATTENTE'} ? 'bg-secondary' :
                                          (${s.statut.name() == 'EN_COURS'} ? 'bg-primary' :
                                          (${s.statut.name() == 'TERMINE'} ? 'bg-warning text-dark' : 'bg-success'))"></span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(stages)}">
                <td colspan="6" class="text-center text-muted py-4">Aucun stage trouvé.</td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
