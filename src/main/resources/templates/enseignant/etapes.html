<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Étapes de progression</title>
</head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Étapes de progression</h1>
        <a th:href="${stage.encadrantId != null} ? @{/enseignant/etudiants(enseignantId=${stage.encadrantId})} : @{/enseignant/etudiants}"
           class="btn btn-outline-secondary btn-sm">← Mes étudiants</a>
    </div>

    <!-- Rappel du stage -->
    <p class="text-muted">
        Étudiant : <strong th:text="${stage.etudiantNomComplet}"></strong> ·
        Stage : <span th:text="${stage.sujet}"></span> ·
        Entreprise : <span th:text="${stage.entrepriseNom}"></span>
    </p>

    <!-- Progression globale -->
    <div class="mb-4">
        <div class="d-flex justify-content-between small text-muted mb-1">
            <span><span th:text="${nbValidees}">0</span> étape(s) validée(s) sur
                  <span th:text="${#lists.size(etapes)}">0</span></span>
            <span th:text="${pourcentage} + ' %'">0 %</span>
        </div>
        <div class="progress">
            <div class="progress-bar bg-success" role="progressbar"
                 th:style="'width: ' + ${pourcentage} + '%'"></div>
        </div>
    </div>

    <!-- Liste des étapes -->
    <div class="table-responsive mb-4">
        <table class="table table-striped table-hover align-middle bg-white">
            <thead class="table-light">
            <tr>
                <th>Étape</th>
                <th>Description</th>
                <th>Statut</th>
                <th class="text-end">Validation</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="e : ${etapes}">
                <td class="fw-semibold" th:text="${e.titre}"></td>
                <td th:text="${e.description}"></td>
                <td>
                    <span class="badge" th:text="${e.statut}"
                          th:classappend="${e.statut.name() == 'A_FAIRE'} ? 'bg-secondary' :
                                          (${e.statut.name() == 'EN_COURS'} ? 'bg-primary' :
                                          (${e.statut.name() == 'TERMINEE'} ? 'bg-warning text-dark' : 'bg-success'))"></span>
                </td>
                <td class="text-end">
                    <!-- Terminée par l'étudiant : l'encadrant peut valider -->
                    <form th:if="${e.statut.name() == 'TERMINEE' and !e.validee}"
                          th:action="@{/enseignant/stages/{sid}/etapes/{id}/valider(sid=${stage.id}, id=${e.id})}"
                          method="post" class="d-inline"
                          onsubmit="return confirm('Valider cette étape ?');">
                        <button type="submit" class="btn btn-sm btn-success">Valider</button>
                    </form>
                    <span th:if="${e.validee}" class="text-success fw-semibold">Validée ✔</span>
                    <span th:if="${!e.validee and e.statut.name() != 'TERMINEE'}"
                          class="text-muted small">En attente de l'étudiant</span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(etapes)}">
                <td colspan="4" class="text-center text-muted py-4">Aucune étape définie pour ce stage.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Ajout d'une étape -->
    <form th:action="@{/enseignant/stages/{sid}/etapes(sid=${stage.id})}" th:object="${etape}"
          method="post" class="card card-body">
        <h2 class="h5 mb-3">Ajouter une étape</h2>

        <div class="row g-3">
            <div class="col-md-5">
                <label for="titre" class="form-label">Titre *</label>
                <input type="text" id="titre" th:field="*{titre}" class="form-control"
                       placeholder="Ex : Étude de l'existant"
                       th:classappend="${#fields.hasErrors('titre')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{titre}"></div>
            </div>

            <div class="col-md-7">
                <label for="description" class="form-label">Description</label>
                <input type="text" id="description" th:field="*{description}" class="form-control"
                       th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{description}"></div>
            </div>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Ajouter</button>
        </div>
    </form>
</section>
</body>
</html>
