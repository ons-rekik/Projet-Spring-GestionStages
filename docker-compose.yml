services:
  db:
    image: postgres:16-alpine
    container_name: gestion-stages-db
    environment:
      POSTGRES_DB: gestion_stages
      POSTGRES_USER: ${DB_USER:-stages}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stages123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-stages} -d gestion_stages"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: gestion-stages-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/gestion_stages
      DB_USER: ${DB_USER:-stages}
      DB_PASSWORD: ${DB_PASSWORD:-stages123}

volumes:
  pgdata: